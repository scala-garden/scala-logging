name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - run: sbt +scalafmtCheckAll integration-test/scalafmtCheckAll scalafmtSbtCheck
  test:
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
        scala: [ 2.12.x, 2.13.x, 3.x ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
      - uses: sbt/setup-sbt@v1
      - name: Test
        run: |
          sbt ++${{matrix.scala}} test core/packageBin core/makePom
          git diff --exit-code
          
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
        scala: [ 2.13.x, 3.x ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
      - uses: sbt/setup-sbt@v1
      - name: Test
        run: |
          sbt ++${{matrix.scala}} integration-test/test
          git diff --exit-code
